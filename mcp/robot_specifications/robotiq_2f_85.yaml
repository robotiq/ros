# Robotiq 2F-85 datasheet. One file per gripper model, the same on every host;
# cell wiring (which grippers exist, their ROS namespace) lives in grippers.yaml.
# Supporting another Robotiq model is adding one file here, no code.

model: robotiq_2f_85

# The joint robotiq_gripper_controller commands, as named by robotiq_description.
command_joint: robotiq_85_left_knuckle_joint

geometry:
  max_opening_mm: 85.0
  min_opening_mm: 0.0

  # The command joint's range from the URDF (limit lower/upper). 0 is OPEN.
  # The opening is mapped onto it linearly; the real linkage is a four-bar, so
  # mid-stroke openings are approximate.
  knuckle_rad_open: 0.0
  knuckle_rad_closed: 0.8

defaults:
  # Same value the controller configs in robotiq_description ship with.
  max_effort_n: 50.0
  motion_timeout_s: 10.0

# TSF-85 tactile fingers, when fitted. Omit this block for a model with no
# tactile option; a gripper without pads leaves `tactile` unset in grippers.yaml.
# The 7x4 grid per pad is what robotiq_tsf publishes (Taxels: uint16[28]).
tactile:
  rows: 7
  cols: 4
  pads: [left, right]

  # Signal 1.0 means every taxel on both pads is at the working ceiling:
  # 56 taxels x 110 counts. Tuned against the Isaac Sim twin's tactile
  # extension (hottest taxel ~106, no-contact floor ~0.0003 of full scale).
  # Unverified against a physical TSF-85; re-measure before trusting it there.
  full_scale_counts: 6200.0

  # Contact is declared at or above this signal. Deliberately just above the
  # noise floor: the point is to notice FIRST touch, not a firm grip.
  contact_threshold: 0.02

  # Matches the tactile SDK's findBaseline(), which averages 1000 samples.
  baseline_samples: 1000

  # Closing increment between tactile reads during gripper_grasp_until_contact.
  # The sensor updates at 60 Hz; stepping faster than it reports gains nothing.
  step_mm: 2.0

  # Hard wall-clock ceiling on a contact grasp. A safety limit: it is the one
  # tool that issues repeated motion from inside a single call.
  contact_timeout_s: 5.0
