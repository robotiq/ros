[project]
name = "robotiq-gripper-mcp"
version = "1.1.0"
description = "MCP server exposing Robotiq 2F grippers to LLM agents through the ROS 2 driver"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gripper_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
