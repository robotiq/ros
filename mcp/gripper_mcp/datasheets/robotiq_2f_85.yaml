# Robotiq 2F-85 datasheet. One file per gripper model, the same on every host;
# cell wiring (which grippers exist, their ROS namespace) lives in grippers.yaml.
# Supporting another Robotiq model is adding one file here, no code.
#
# Only what the robot description cannot tell us belongs here. The command
# joint's name and range are read from the robot at startup, never copied.

model: robotiq_2f_85

# Product datasheet. The opening is mapped onto the command joint's range
# linearly; the real linkage is a four-bar, so mid-stroke openings are approximate.
stroke:
  max_opening_mm: 85.0
  min_opening_mm: 0.0
  # Margin for every position comparison the service makes: a move that
  # ends within this of its target reached it, a close that ends further
  # than this from the stop found something. One position-register count
  # is stroke/227 = 0.37 mm on this model and the driver truncates, so a
  # correct move can land a count or two off; 1.5 mm sits above two counts
  # and covers a real 2F-85 wearing TSF fingers, which settles 0.75 mm short
  # of the description's closed angle.
  closed_tolerance_mm: 1.5

defaults:
  # Effort when a call does not name one, 0.0 = the gripper's minimum force,
  # 1.0 = its maximum. The product datasheet's 20-235 N is not used: the force
  # register has no newton equivalent (grip force depends on the speed, the
  # fingers and the object), so the MCP commands effort the way the SDK does.
  effort: 0.2
  motion_timeout_s: 10.0

# Tactile pads that fit this gripper: datasheets/tactile/<tactile_model>.yaml.
# Omit for a model with no tactile option. Whether a given gripper wears them
# is the wiring's business (`tactile: ros` in grippers.yaml).
tactile_model: robotiq_tsf_85
