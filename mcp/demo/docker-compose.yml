# The whole gripper stack with no hardware: the ros2_control driver on fake
# hardware, RViz showing it, and the MCP server, one container each, all on the
# host's network so they share one DDS graph. Point an MCP client (Claude Code,
# for one) at http://127.0.0.1:8301/mcp and watch the 2F-85 move in RViz.
#
#   docker build -f docker/Dockerfile -t robotiq_ros2:jazzy .     # once
#   docker build -t robotiq_gripper_mcp:jazzy mcp                  # once
#   ./mcp/demo/demo.sh            # xhost + compose up; demo.sh down tears down
#
# RViz needs a base image built with the default WITH_GUI=true; skip it on a
# headless base with `docker compose ... up -d gripper-driver gripper-mcp`.
# Closing the RViz window ends its container; the next `up` brings it back.
# ROS_DOMAIN_ID is fixed at 42, not read from the environment, so the demo
# never joins a real cell's graph even on a host that exports the cell's
# domain; the port is 8301 so it never shadows a server already on 8300.
# GRIPPER_MCP_IMAGE must match the tag docker/docker-compose.yml built.
services:
  gripper-driver:
    image: ${ROBOTIQ_ROS2_IMAGE:-robotiq_ros2:jazzy}
    container_name: robotiq_demo_driver
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: "42"
    command:
      - -c
      - >
        source /opt/ros/$${ROS_DISTRO}/setup.bash
        && source /ws/install/setup.bash
        && exec ros2 launch robotiq_description robotiq_control.launch.py
        use_fake_hardware:=true gripper_model:=2f_85

  rviz:
    image: ${ROBOTIQ_ROS2_IMAGE:-robotiq_ros2:jazzy}
    container_name: robotiq_demo_rviz
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: "42"
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command:
      - -c
      - >
        source /opt/ros/$${ROS_DISTRO}/setup.bash
        && source /ws/install/setup.bash
        && exec rviz2 -d
        /ws/install/robotiq_description/share/robotiq_description/rviz/view_urdf.rviz
    depends_on:
      - gripper-driver

  gripper-mcp:
    image: ${GRIPPER_MCP_IMAGE:-robotiq_gripper_mcp:jazzy}
    container_name: robotiq_demo_mcp
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: "42"
    volumes:
      - ./grippers.yaml:/config/grippers.yaml:ro
    command:
      - --config
      - /config/grippers.yaml
      - --port
      - ${GRIPPER_MCP_PORT:-8301}
    depends_on:
      - gripper-driver
