# The whole gripper stack with no hardware: the ros2_control driver on fake
# hardware in one container, the MCP server in another, both on the host's
# network so they share one DDS graph. Then demo.py walks the tool surface.
#
#   docker build -f docker/Dockerfile -t robotiq_ros2:jazzy .     # once
#   docker build -t robotiq_gripper_mcp:jazzy mcp                  # once
#   docker compose -f mcp/demo/docker-compose.yml up -d
#   cd mcp && uv run demo/demo.py
#   docker compose -f mcp/demo/docker-compose.yml down
#
# ROS_DOMAIN_ID defaults to 42 and the port to 8301 so the demo never joins a
# real cell's graph or shadows a server already on 8300.
services:
  gripper-driver:
    image: ${ROBOTIQ_ROS2_IMAGE:-robotiq_ros2:jazzy}
    container_name: robotiq_demo_driver
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    command:
      - -c
      - >
        source /opt/ros/$${ROS_DISTRO}/setup.bash
        && source /ws/install/setup.bash
        && exec ros2 launch robotiq_description robotiq_control.launch.py
        use_fake_hardware:=true gripper_model:=2f_85

  gripper-mcp:
    image: ${GRIPPER_MCP_IMAGE:-robotiq_gripper_mcp:jazzy}
    container_name: robotiq_demo_mcp
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    volumes:
      - ./grippers.yaml:/config/grippers.yaml:ro
    command:
      - --config
      - /config/grippers.yaml
      - --port
      - ${GRIPPER_MCP_PORT:-8301}
    depends_on:
      - gripper-driver
