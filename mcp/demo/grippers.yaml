# Wiring for the demo stack: one 2F-85 on the real driver, running
# ros2_control's fake hardware at the root of the graph (hence namespace: /).
# Fake hardware reports exactly the angle it was commanded, so a grasp closes to
# 0 mm and reports closed_without_object. A real gripper stops short on an object
# (and reports stalled on every goal, see #29); the tactile tools need real pads.

- name: driver
  model: robotiq_2f_85
  namespace: /
  description: 2F-85 through robotiq_gripper_controller on ros2_control's fake hardware
