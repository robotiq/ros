# Jazzy / Lyrical controller configuration. Humble uses
# config/robotiq_controllers.humble.yaml instead (no parallel_gripper_controller
# package there); launch/robotiq_control.launch.py selects per $ROS_DISTRO.
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    # Jazzy and newer: parallel_gripper_action_controller replaces gripper_controllers package
    robotiq_gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController
    robotiq_activation_controller:
      type: robotiq_controllers/RobotiqActivationController

robotiq_gripper_controller:
  ros__parameters:
    joint: $(var gripper_joint)

    # Enable effort control (replacement for use_effort_interface)
    max_effort_interface: "$(var gripper_joint)/set_gripper_max_effort"
    max_effort: 50.0   # TODO tune

    # Enable velocity/speed control (replacement for use_speed_interface)
    max_velocity_interface: "$(var gripper_joint)/set_gripper_max_velocity"
    max_velocity: 0.5    # TODO tune

    # Optional (recommended)
    state_interfaces: ["position", "velocity"]
    allow_stalling: true
    stall_timeout: 0.05
    goal_tolerance: 0.02

robotiq_activation_controller:
  ros__parameters:
    default: true
