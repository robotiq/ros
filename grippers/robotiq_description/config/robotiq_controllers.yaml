# Jazzy / Lyrical controller configuration for the driver. Humble uses
# config/robotiq_controllers.humble.yaml instead (no parallel_gripper_controller
# package there); the ros2_control mock and the topic_based plugin have their
# own, robotiq_controllers.mock.yaml and robotiq_controllers.topic_based.yaml.
# launch/robotiq_control.launch.py selects per $ROS_DISTRO and hardware flag.
# Humble EOL: simplify — one configuration per hardware plugin remains.
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz
    # The gripper runs its own motion profile to each position goal. Lyrical
    # defaults this to true, which ramps the position command at the URDF
    # velocity limit and streams intermediate targets to the gripper.
    enforce_command_limits: false
    # Jazzy defaults this to true and takes ros2_control_node down when the
    # gripper is not connected; Lyrical defaults to false. Set explicitly so every
    # distro keeps the node up and the connection can be retried from the CLI.
    # Humble has no such parameter.  Humble EOL: delete this sentence.
    hardware_components_initial_state:
      shutdown_on_initial_state_failure: false
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    robotiq_gripper_controller:
      type: robotiq_controllers/GripperActionController
    robotiq_activation_controller:
      type: robotiq_controllers/RobotiqActivationController
    robotiq_gripper_status_broadcaster:
      type: robotiq_controllers/GripperStatusBroadcaster

robotiq_gripper_controller:
  ros__parameters:
    joint: $(var gripper_joint)

    # Enable effort control (replacement for use_effort_interface)
    max_effort_interface: "$(var gripper_joint)/set_gripper_max_effort"
    max_effort: 50.0   # TODO tune

    # Enable velocity/speed control (replacement for use_speed_interface)
    max_velocity_interface: "$(var gripper_joint)/set_gripper_max_velocity"
    max_velocity: 0.5    # TODO tune

    # Optional (recommended)
    state_interfaces: ["position", "velocity"]
    allow_stalling: true
    stall_timeout: 0.05
    goal_tolerance: $(var gripper_goal_tolerance)
    # Hz; how often a decided goal is relayed to the client (stock: 20).
    action_monitor_rate: 100.0
    use_object_status: true
    # Aborts a goal the gripper has not decided within this many seconds of
    # its acceptance or of the last motion seen.
    object_status_timeout: 10.0

robotiq_activation_controller:
  ros__parameters:
    default: true
